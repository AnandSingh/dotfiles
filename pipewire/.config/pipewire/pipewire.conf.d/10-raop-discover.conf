# Auto-load the RAOP (AirPlay) discovery module so AirPlay-2 receivers on the
# network — e.g. the Sonos One SL / Five speakers — show up as PipeWire sinks at
# startup. Without this, `pactl load-module module-raop-discover` must be run by
# hand each session. Discovery uses mDNS (avahi), so the speakers must be on a
# reachable/same-VLAN network.
context.modules = [
    { name = libpipewire-module-raop-discover }
]
