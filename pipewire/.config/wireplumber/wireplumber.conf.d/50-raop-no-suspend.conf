# Keep RAOP (AirPlay/Sonos) sinks always connected — never suspend on idle.
# Default PipeWire suspends an idle sink after ~5s; for a RAOP sink that tears
# down the AirPlay session, so pause/play drops and reconnects the Sonos (audible
# gap) AND makes the sink's monitor disappear, which kills the cava visualizer.
# suspend-timeout 0 = never suspend → Sonos stays connected, monitor stays alive.
node.rules = [
  {
    matches = [
      { node.name = "~raop_sink\\..*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
