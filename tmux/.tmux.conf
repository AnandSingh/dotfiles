# Tmux Configuration for Fedora Linux
# Adapted for Wayland (wl-copy/wl-paste)

# ==================== General Settings ====================

# Change prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Allow opening multiple terminals to view the same session at different sizes.
setw -g aggressive-resize on

# Set terminal to support 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# Extended keys — let TUIs (Claude Code, Neovim) distinguish modified Enter and
# other special keys (Ctrl+Enter, Shift+Enter, Alt+Enter, …). `extended-keys on`
# forwards them when the app requests them; the terminal-features line tells tmux
# the outer terminal (kitty exports TERM=xterm-kitty) can carry them. If a combo
# still doesn't register, change `on` to `always`.
set -g extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'

# Enable mouse support
set -g mouse on

# OSC 52 clipboard — terminal handles copy directly to system clipboard
set -g set-clipboard on

# Wayland clipboard socket. tmux freezes its startup environment, and under sway
# kitty sometimes launches via XWayland without WAYLAND_DISPLAY — leaving the
# wl-copy/wl-paste bindings below with no socket, so selection-copy silently
# fails. If WAYLAND_DISPLAY is unset at server start, detect the live socket and
# pin it into the global env so new panes and the copy bindings can reach it.
run-shell 'test -n "$WAYLAND_DISPLAY" || tmux set-environment -g WAYLAND_DISPLAY "$(basename "$(ls /run/user/$(id -u)/wayland-[0-9]* 2>/dev/null | grep -v lock | head -n1)" 2>/dev/null)"'
set -ga update-environment " WAYLAND_DISPLAY"

# Start window numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 10000

# No delay for escape key (for vim)
set -s escape-time 0

# Enable focus events (for vim)
set -g focus-events on

# Ensure window titles get renamed automatically.
setw -g automatic-rename on

# ==================== Key Bindings ====================

# Reload config with prefix + R
bind R source-file ${HOME}/.tmux.conf \; display '~/.tmux.conf Reloaded !!'

# Edit tmux config
bind e split-window -h 'nvim ~/.tmux.conf'

# Split panes using | and - (more intuitive)
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Break current pane out into its own window (mirror of default !, kept explicit)
bind ! break-pane

# Join a pane back into THIS window: pick the source pane from a tree, no typing
bind @ choose-tree -Zw "join-pane -s '%%'"

# Project window — fuzzy-find a project and open it as a new window (popup).
# prefix+C (Shift+c); plain prefix+c stays the instant new-window-in-cwd.
bind C display-popup -E -w 60% -h 60% "$HOME/.local/bin/tmux-project"

# Pane navigation with vim keys (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation without prefix (Alt + arrow keys)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with vim movement keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation with Shift + arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# Swap windows
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# ==================== Copy Mode (Vim Style) ====================

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Use v to begin selection, y to copy, r for rectangle
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Wayland clipboard integration (wl-copy/wl-paste)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy" \; display-message "copied to system clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Middle-click paste from system clipboard
bind-key -n MouseDown2Pane run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# Paste from system clipboard with prefix + P
bind P run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# Ctrl+v (no prefix) = smart paste. In Vim/Neovim it passes straight through
# (visual-block). Otherwise: a clipboard IMAGE is saved to ~/Pictures/clipboard/
# and its path is typed into the pane (so Claude Code etc. can attach it), while
# clipboard TEXT is pasted normally. Native Ctrl+V image paste doesn't work in tmux.
bind -n C-v if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'" \
    "send-keys C-v" \
    "run-shell '${HOME}/.local/bin/tmux-paste-image'"

# Double click to select word, triple click for line (with mouse)
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# ==================== Vim-Tmux Navigator ====================

# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ==================== Status Bar ====================

# Update status bar every 5 seconds
set -g status-interval 5

# Status bar position
set -g status-position bottom

# Status bar colors
set -g status-style "bg=#1e1e1e,fg=#ffffff"

# Left status: session name
set -g status-left "#[fg=#61afef,bold] #S #[fg=#ffffff] "
set -g status-left-length 40

# Right status: date, time, hostname
set -g status-right "#[fg=#98c379] %Y-%m-%d #[fg=#61afef] %H:%M #[fg=#c678dd] #h "
set -g status-right-length 60

# Window status format
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #[fg=#e5c07b,bold]#I:#W#F "

# Window status colors
setw -g window-status-style "fg=#abb2bf,bg=#1e1e1e"
setw -g window-status-current-style "fg=#e5c07b,bg=#282c34,bold"
setw -g window-status-activity-style "fg=#e06c75,bg=#1e1e1e"
setw -g window-status-bell-style "fg=#e06c75,bg=#1e1e1e,bold"

# Pane borders
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"

# Message colors
set -g message-style "bg=#282c34,fg=#e5c07b"
set -g message-command-style "bg=#282c34,fg=#e5c07b"

# ==================== Activity Monitoring ====================

# Highlight windows with activity
setw -g monitor-activity on
set -g visual-activity off

# ==================== Miscellaneous ====================

# Don't rename windows automatically
set -g allow-rename off

# Display pane numbers for 2 seconds when switching
set -g display-panes-time 2000

# Clear screen with prefix + C-l
bind C-l send-keys 'C-l'

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Sync panes (send input to all panes) with prefix + s
bind s setw synchronize-panes

# ==================== TPM (Tmux Plugin Manager) ====================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Load lightline theme if available
if-shell "test -f ~/.lightline.tmux.conf" "source ~/.lightline.tmux.conf"

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @continuum-boot 'on'

# tmux-yank: use system clipboard
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Load local overrides
if-shell "test -f ~/.tmux.conf.local" {
    source-file ~/.tmux.conf.local
}
