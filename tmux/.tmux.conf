# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# prefix + u : fzf-pick any URL on the current pane and open it in the browser.
# Self-contained (no plugin/network) — needs fzf + xdg-open, both present.
bind-key u display-popup -w 80% -h 50% -E "~/.tmux/scripts/fzf-url.sh '#{pane_id}'"

if-shell "test -f ~/.lightline.tmux.conf" "source ~/.lightline.tmux.conf"

# Change prefix key (also useful to map control to caps-lock)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse + terminal features
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB,screen-256color:RGB,kitty:RGB"

# Allow opening multiple terminals to view the same session at different sizes.
setw -g aggressive-resize on

# More intuitive windows/panes, always preserving current directory.
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind Tab last-window
bind Space next-layout
bind C-s setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# Useful launchers
bind R source-file ${HOME}/.tmux.conf \; display-message '~/.tmux.conf reloaded'
bind e split-window -h -c '#{pane_current_path}' 'nvim ~/.tmux.conf'
bind C-f command-prompt -p "find window:" "find-window '%%'"
bind C-j choose-tree -Zw

# Scrollback and copy mode
set-option -g history-limit 50000
setw -g mode-keys vi
bind [ copy-mode

# Ensure window titles get renamed automatically.
setw -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Start tab numbering at 1
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1

# Faster escape improves Neovim responsiveness.
set -s escape-time 10

# Copy from tmux to the system clipboard on Wayland/X11 when possible.
set -g @copy_command "sh -c 'if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}" \; display-message "copied to system clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}" \; display-message "copied to system clipboard"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}" \; display-message "copied to system clipboard"

# resize panes with vim movement keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Persist tmux state across reboots.
# Continuum saves periodically; Resurrect restores panes/windows/programs.
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-systemd-start-cmd 'new-session -d -s main'

# Restore Vim/Neovim sessions when possible.
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Manual bindings from tmux-resurrect:
#   prefix + Ctrl-s  save now
#   prefix + Ctrl-r  restore now


if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# Enable modified key combinations (e.g. Shift+Enter, Ctrl+Enter)
set -g extended-keys on
