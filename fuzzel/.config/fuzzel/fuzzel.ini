# Fuzzel launcher — themed to match the Sway catppuccin-mocha palette.
# Bound to Super+Space via wm-dev-menu.

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
prompt=❯
terminal=kitty -e
layer=overlay
width=42
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=10
icons-enabled=yes
fields=name,generic,comment,categories,keywords

[colors]
background=1e1e2ef0
text=cdd6f4ff
prompt=89b4faff
input=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff

[border]
width=2
radius=10
