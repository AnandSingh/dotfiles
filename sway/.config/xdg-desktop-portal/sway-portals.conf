# xdg-desktop-portal backend selection for the Sway session.
# Read when XDG_CURRENT_DESKTOP contains "sway" (the Sway config forces that).
# Pin to gtk + wlr so the portal never tries the GNOME backend, which hangs
# ~25s outside gnome-shell and takes the portal (and waybar) down with it.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
