# Per-machine Sway overrides — Fedora desktop (NVIDIA RTX 5080, 3840x2400).
# Seeded to ../config.d/local.conf by bootstrap.sh on Fedora hosts.
#
# Holds everything that was hard-coded in the old monolithic Fedora config but
# does NOT belong in the shared portable base: this box's monitor wall, its
# input tuning, and apps that only exist on this machine.

# ==================== Monitors ====================
output eDP-1 resolution 3840x2400 position 0,0 scale 1
output DP-1 resolution 3840x2160 position 3840,0
output DP-2 resolution 3840x2160 position 0,0
output HDMI-A-1 resolution 1920x1080 position 0,0 transform 90
output * bg #1e1e2e solid_color

# ==================== Input ====================
input "type:keyboard" {
    xkb_layout us
    repeat_delay 300
    repeat_rate 50
}

input "type:touchpad" {
    tap enabled
    natural_scroll disabled
    dwt enabled
    middle_emulation enabled
}

# ==================== Machine-only apps ====================
# VS Code (Facebook build) -> ws3:code
assign [class="code-fb"] $ws3
bindsym $mod+c exec code-fb

# Google Chat -> ws7
assign [class="Google Chat"] $ws7
assign [title="Google Chat"] $ws7
exec $browser --new-window --app=https://chat.google.com

# Wallpaper via swww (install: cargo/dnf). Comment out if not installed.
exec swww-daemon --format xrgb
exec sleep 1 && swww img ~/Pictures/wallpapers/catppuccin-geometric.png --transition-type fade --transition-duration 1

# SwayNotificationCenter instead of mako. Only enable if swaync is installed
# AND you remove `exec mako` from the base — running both conflicts.
# exec swaync
# bindsym $mod+n exec swaync-client -t -sw
