# Per-machine Sway overrides — Ubuntu / Nvidia laptop.
# Seeded to ../config.d/local.conf by bootstrap.sh on Ubuntu hosts.

# ==================== Input ====================
input "type:keyboard" {
    xkb_options ctrl:nocaps
}

input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
}

# ==================== Monitors ====================
# Laptop panel is auto-detected. Add external outputs as needed, e.g.:
# output eDP-1 scale 1.5
# output HDMI-A-1 resolution 3840x2160 position 1920,0
