# Per-machine Sway overrides — Ubuntu / Nvidia laptop.
# Seeded to ../config.d/local.conf by bootstrap.sh on Ubuntu hosts.

# ==================== Input ====================
input "type:keyboard" {
    xkb_options ctrl:nocaps
}

input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
}

# ==================== Monitors ====================
# Internal panel: Sharp LQ156M1JW03, 1920x1080 @ 240Hz. Force the high
# refresh rate (default mode may pick 60Hz).
output eDP-1 resolution 1920x1080@240.001Hz position 0,0 scale 1
output * bg #1e1e2e solid_color

# External outputs — add as needed, e.g.:
# output HDMI-A-1 resolution 3840x2160 position 1920,0 scale 1

# Screenshots — base config binds these to PrtSc, but this MSI laptop's Print
# key is Fn-gated and never emits the `Print` keysym, so those bindings never
# fire. Bind reliable $mod combos instead (this local.conf is included last, so
# it wins). $mod+Shift+p = select area to clipboard; $mod+p = full screen to file.
bindsym $mod+Shift+p exec grim -g "$(slurp)" - | wl-copy && notify-send "Area copied to clipboard"
bindsym $mod+p exec grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot saved"
