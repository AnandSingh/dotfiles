# Per-machine Sway overrides — Fedora NVIDIA laptop (ThinkPad, i7-13800H +
# RTX 4080 Mobile + Intel Iris Xe, 3840x2400 eDP panel).
#
# This box is a hybrid of the two existing profiles: Fedora (like the desktop)
# but a single-panel NVIDIA laptop (like the Ubuntu laptop).
#
# TRACKED TEMPLATE. bootstrap.sh's seed_sway_local() copies this to
# ../config.d/local.conf on Fedora hosts whose chassis is "laptop" (see
# `hostnamectl chassis`); Fedora desktops get local.fedora-desktop.conf instead.
# Seeded once — the live config.d/local.conf is git-ignored and hand-editable
# after that, so a `git pull` never clobbers a machine's local tweaks.

# ==================== Monitors ====================
# External Samsung 4K monitor (DP-2, LF32TU87) is the MAIN display when docked:
# placed at the origin (0,0) at scale 1 so it hosts the primary workspaces.
output DP-2 resolution 3840x2160 position 0,0 scale 1

# Internal 4K panel. scale 1.75 balances UI size and screen real estate on the
# ~16" 3840x2400 screen (logical 2194x1371). Sits to the RIGHT of the external
# monitor when docked (DP-2 is 3840px wide at scale 1 → logical 3840). When
# undocked, DP-2 is absent and this position is ignored — eDP-1 is the sole
# output. Bump to 2 for larger UI, or 1.5 for even more space.
output eDP-1 resolution 3840x2400 position 3840,0 scale 1.75
output * bg #1e1e2e solid_color

# Lid close: disable the internal panel so sway migrates its workspaces to the
# external monitor (no windows stranded on the dark screen). Lid open re-enables
# it. --locked lets it fire while the screen is locked; --reload re-applies on
# `swaymsg reload`. When UNDOCKED, disabling eDP-1 leaves no outputs, so logind's
# default (suspend on lid close) takes over — which is what you want.
bindswitch --reload --locked lid:on output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable

# Primary workspaces live on the external monitor when docked, and fall back to
# the internal panel when undocked (sway uses the first output in the list that
# is currently connected). Keeps 8–10 on the laptop panel as a side stack when
# docked.
workspace 1 output DP-2 eDP-1
workspace 2 output DP-2 eDP-1
workspace 3 output DP-2 eDP-1
workspace 4 output DP-2 eDP-1
workspace 5 output DP-2 eDP-1
workspace 6 output DP-2 eDP-1
workspace 7 output DP-2 eDP-1
workspace 8 output eDP-1 DP-2
workspace 9 output eDP-1 DP-2
workspace 10 output eDP-1 DP-2

# ==================== Input ====================
input "type:keyboard" {
    xkb_layout us
    repeat_delay 300
    repeat_rate 50
}

input "type:touchpad" {
    tap enabled
    natural_scroll disabled
    dwt enabled
    middle_emulation enabled
}

# ==================== Screenshots ====================
# Reliable $mod combos (PrtSc on laptops is often Fn-gated and never emits the
# `Print` keysym). $mod+Shift+p = select area to clipboard; $mod+p = full screen
# to ~/Pictures.
bindsym $mod+Shift+p exec grim -g "$(slurp)" - | wl-copy && notify-send "Area copied to clipboard"
bindsym $mod+p exec grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot saved"

# ==================== File managers ====================
# Super+e stays bound to thunar (GUI) in the base config. Add yazi (TUI) on
# Super+y — opens in a kitty window. yazi binary lives in ~/.local/bin.
# (Not Super+Shift+e: that's the base config's "Exit Sway" dialog — reusing it
# triggers an "overwriting binding" warning that pops the red swaynag bar.)
bindsym $mod+y exec $term -e yazi

# ==================== Wallpaper (optional) ====================
# Requires swww installed and the image present. Uncomment to enable:
# exec swww-daemon --format xrgb
# exec sleep 1 && swww img ~/Pictures/wallpapers/catppuccin-geometric.png --transition-type fade --transition-duration 1

# ==================== Twingate ====================
# Daemon autostarts via the enabled `twingate.service`. Start the notifier so
# expired sessions pop a clickable re-auth prompt in this graphical session.
exec twingate desktop-start

# ==================== Notes ====================
# Desktop-only apps from the Fedora-desktop profile are intentionally omitted
# here (code-fb / Google Chat app-window / desktop wallpaper) — code-fb doesn't
# exist on this machine. Add any you want back in.
