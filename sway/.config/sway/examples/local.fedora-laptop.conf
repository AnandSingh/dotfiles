# Per-machine Sway overrides — Fedora NVIDIA laptop (ThinkPad, i7-13800H +
# RTX 4080 Mobile + Intel Iris Xe, 3840x2400 eDP panel).
#
# TRACKED TEMPLATE. bootstrap.sh seeds this once as config.d/local.conf on Fedora
# laptops; the live machine file remains Git-ignored so later pulls do not replace
# host-specific adjustments. Included last by the base config, so it wins.

# ==================== Monitors ====================
# Dell U4025QW is the permanent MAIN display. Match its EDID identity rather
# than DP-2 so it remains primary if the dock assigns a different connector.
# Native 5K2K at 120 Hz provides the full panel resolution and refresh rate.
output "Dell Inc. DELL U4025QW CR1KHJ4" resolution 5120x2160@120Hz position 0 0 scale 1

# Internal 4K panel. It sits to the right when the lid is open and becomes the
# workspace fallback whenever the Dell is disconnected.
output eDP-1 resolution 3840x2400 position 5120 0 scale 1.75
output * bg #1e1e2e solid_color

# Lid events use one state-aware helper. The delayed reload sync runs after the
# output mode declarations above and changes state only when it is actually wrong.
# The same helper runs after resume from the portable swayidle configuration.
exec_always sh -c 'sleep 0.5; ~/.config/sway/scripts/lid-sync.sh'
bindswitch --locked lid:on exec ~/.config/sway/scripts/lid-sync.sh
bindswitch --locked lid:off exec ~/.config/sway/scripts/lid-sync.sh

# The Dell is first choice for every normal workspace, making it the effective
# primary output. The internal panel is the automatic undocked fallback.
workspace 1 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 2 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 3 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 4 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 5 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 6 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 7 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 8 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1
workspace 9 output "Dell Inc. DELL U4025QW CR1KHJ4" eDP-1

# Only 9 workspaces on this machine — disable the base config's ws10 binds so
# $mod+0 / $mod+Shift+0 don't spawn a stray 10th workspace on the focused output.
unbindsym $mod+0
unbindsym $mod+Shift+0

# --- Dell ambient HUD (optional) ---
# Keep all screen space available by default. Super+Shift+G toggles the ambient
# HUD and its workspace 6–9 top gap when wanted.
bindsym $mod+Shift+g exec ~/.config/eww/scripts/hud-toggle.sh

# --- Audio output picker (laptop / Sonos rooms) ---
# $mod+Shift+a opens a fuzzel menu of the laptop speaker + every Sonos room on the
# network (AirPlay). Picking one routes all audio there (survives Sonos re-pairing —
# resolved by room name, not IP) and makes the cava EQ visualizer follow the sink.
# Sonos outputs appear via the raop-discover module (pipewire stow package).
bindsym $mod+Shift+a exec ~/.config/eww/scripts/sound-menu.sh

# ==================== Input ====================
input "type:keyboard" {
    xkb_layout us
    repeat_delay 300
    repeat_rate 50
}

input "type:touchpad" {
    tap enabled
    natural_scroll disabled
    dwt enabled
    middle_emulation enabled
}

# ==================== Screenshots ====================
# Handled entirely by the base config's Print-key binds (Print / $mod+Print /
# $mod+Shift+Print / Alt+Print). Left to upstream: this box drives an external
# keyboard that emits a real Print keysym, so no laptop-specific screenshot
# override is needed here.

# ==================== File managers ====================
# Super+e stays bound to thunar (GUI) in the base config. Add yazi (TUI) on
# Super+y — opens in a kitty window. yazi binary lives in ~/.local/bin.
# (Not Super+Shift+e: that's the base config's "Exit Sway" dialog — reusing it
# triggers an "overwriting binding" warning that pops the red swaynag bar.)
bindsym $mod+y exec $term -e yazi

# ==================== Twingate ====================
# Daemon autostarts via the enabled `twingate.service`. Start the notifier so
# expired sessions pop a clickable re-auth prompt in this graphical session.
exec twingate desktop-start

# ==================== Notes ====================
# Desktop-only apps from the Fedora-desktop profile are intentionally omitted
# here (code-fb / Google Chat app-window / desktop wallpaper) — code-fb doesn't
# exist on this machine. Add any you want back in.

# ==================== Dell KVM ====================
# The Waybar button is primary; keep the original chord as a keyboard fallback.
bindsym --release Control+Alt+F12 exec ddcutil --model "DELL U4025QW" --sn CR1KHJ4 setvcp 60 0x0f --noverify
