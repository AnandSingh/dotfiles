# Developer Hyprland layer.
# Enable from hyprland.conf with:
#   source= $UserConfigs/Developer.conf

$mainMod = SUPER
$term = kitty
$browser = firefox
$filemanager = nautilus

# Desktop plumbing and dev Waybar profile.
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = $HOME/.local/bin/wm-dev-waybar
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Developer launchers.
bind = $mainMod, Return, exec, $term
bind = $mainMod, SPACE, exec, $HOME/.local/bin/wm-dev-menu
bind = $mainMod, B, exec, $browser --new-window
bind = $mainMod, E, exec, $filemanager
bind = $mainMod SHIFT, E, exec, $term --working-directory=$HOME/dotfiles -e nvim WM_DEV_SETUP.md
bind = $mainMod, V, exec, $HOME/.local/bin/wm-dev-clipboard
bind = $mainMod SHIFT, X, exec, $HOME/.local/bin/wm-dev-lock

# Screenshots.
bind = , Print, exec, $HOME/.local/bin/wm-dev-screenshot full
bind = $mainMod, Print, exec, $HOME/.local/bin/wm-dev-screenshot window
bind = SHIFT, Print, exec, $HOME/.local/bin/wm-dev-screenshot area

# Scratchpad terminal workspace.
workspace = special:devterm, gapsout:8, gapsin:8
bind = $mainMod, minus, togglespecialworkspace, devterm
bind = $mainMod SHIFT, minus, movetoworkspace, special:devterm

# Predictable developer workspaces.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# App routing: 1 term, 2 web, 3 code, 4 ops, 5 docs, 6 chat, 7 media, 8 vm.
windowrulev2 = workspace 2 silent, class:^(firefox|Firefox|google-chrome|Google-chrome|chromium|Chromium)$
windowrulev2 = workspace 3 silent, class:^(Code|code|VSCodium|codium)$
windowrulev2 = workspace 6 silent, class:^(Slack|discord|vesktop)$
windowrulev2 = workspace 8 silent, class:^(virt-manager|org.remmina.Remmina|Remmina)$

# Floating utilities.
windowrulev2 = float, class:^(pavucontrol|Pavucontrol|nm-connection-editor|blueman-manager|org.gnome.Calculator|qalculate-gtk)$
windowrulev2 = center, class:^(pavucontrol|Pavucontrol|nm-connection-editor|blueman-manager|org.gnome.Calculator|qalculate-gtk)$
windowrulev2 = size 900 650, class:^(pavucontrol|Pavucontrol)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 70% 70%, title:^(Picture-in-Picture)$

# Slightly calmer defaults for coding.
general {
  gaps_in = 6
  gaps_out = 10
  border_size = 2
}

decoration {
  rounding = 10
}

misc {
  focus_on_activate = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
}
