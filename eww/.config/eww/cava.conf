# cava config for the Dell HUD EQ bars. Raw ASCII output → cava.sh → eww deflisten.
[general]
bars = 12
framerate = 30
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
data_format = ascii
ascii_max_range = 100
channels = mono
bar_delimiter = 59

[smoothing]
noise_reduction = 0.35
