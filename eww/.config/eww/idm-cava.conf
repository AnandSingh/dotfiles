# cava config for the iDotMatrix 32x32 EQ bridge (16 bars, 0-32 height, ~20fps).
# Separate from the on-screen HUD's cava.conf (which uses 12 bars) but same audio
# source (default sink monitor), so it visualizes whatever is playing.
[general]
bars = 16
# 15fps: smooth for the single light bars style without saturating the BLE link.
framerate = 15
autosens = 1

[input]
method = pulse
# auto = the default sink's monitor; cava follows output routing on its own.
source = auto

[output]
method = raw
data_format = ascii
ascii_max_range = 32
channels = mono
bar_delimiter = 59

[smoothing]
noise_reduction = 0.35
