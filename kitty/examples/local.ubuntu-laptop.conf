# ~/.config/kitty/local.conf — Ubuntu laptop (1920x1080, ~143 DPI eDP panel)
# The committed kitty.conf defaults font_size to 14.0 for a 4K display; that's
# oversized here, so override it.
font_size 11.0

# Tight, even padding for the 1080p laptop — the base 8 40 (40px side margins)
# was for centering on the wide 4K desktop monitor; wasteful here.
window_padding_width 6
